# 开发环境（本地IDEA运行）
server:
  port: 8080

spring:
  # 数据库配置（本地）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/finance_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # Redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # 日期格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

# MyBatis-Plus（开发环境开启SQL打印！）
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.finance.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000

# AI
ai:
  enabled: true
  provider: deepseek
  model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
  api-key: ${AI_API_KEY}
  base-url: https://api.siliconflow.cn/v1
  timeout: 60000
  max-tokens: 1000

# 日志（开发环境全开，方便调试）
logging:
  level:
    com.finance: debug
    org.springframework.security: info
    root: info

# 关闭旧版MyBatis
mybatis:
  mapper-scan:
    enabled: false