# 开发环境（本地IDEA运行）
server:
  port: 8080

spring:
  # 数据库配置（本地）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/finance_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # Redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # 日期格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  # Spring AI 配置（Agent 化改造）
  # 双供应商架构（均走 OpenAI 兼容协议）：
  #   Chat      → DeepSeek 官方（deepseek-chat = V3.2，支持 Tool Calling）
  #   Embedding → SiliconFlow（BAAI/bge-m3，1024 维）
  ai:
    model:
      chat: openai        # 多模型共存时选择 Chat 实现
      embedding: openai   # 多模型共存时选择 Embedding 实现
    openai:
      api-key: ${AI_API_KEY}                 # 默认供应商：DeepSeek 官方
      base-url: https://api.deepseek.com
      chat:
        api-key: ${AI_API_KEY}
        base-url: https://api.deepseek.com   # DeepSeek 官方，路径 /v1/chat/completions
        options:
          model: deepseek-chat              # V3.2，支持 Tool Calling
          temperature: 0.7
          max-tokens: 2000
      embedding:
        api-key: ${SILICONFLOW_API_KEY}      # SiliconFlow 账户（Embedding 专用）
        base-url: https://api.siliconflow.cn
        options:
          model: BAAI/bge-m3                 # 中英双语 Embedding，1024 维

# MyBatis-Plus（开发环境开启SQL打印！）
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.finance.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000

# AI（旧版 RestTemplate 直连实现，保留给 UniApp 端使用，逐步由 Agent 模块替代）
ai:
  enabled: true
  provider: deepseek
  model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
  api-key: ${SILICONFLOW_API_KEY}
  base-url: https://api.siliconflow.cn/v1
  timeout: 60000
  max-tokens: 1000

# Agent 模块配置（Agent 化改造）
agent:
  rag:
    enabled: true               # RAG 开关（关闭后 Agent 仅用工具实时查询）
    index-on-startup: true      # 启动时自动为所有用户重建向量索引
    top-k: 5                    # 每次检索返回的文档数
    similarity-threshold: 0.2   # 相似度阈值（过低召回噪声多，过高易漏召回）
  memory:
    max-messages: 20            # 对话记忆窗口（条数）
    redis-prefix: "agent:memory:"  # Redis Key 前缀（含冒号必须加引号）
    ttl-days: 7                 # 对话记忆保留天数

# 周报邮件推送（Resend HTTP API）
# RESEND_API_KEY 在 .env 中配置（resend.com 免费注册获取，100封/天）
# 未验证域名时 from 默认 onboarding@resend.dev，只能发给 Resend 账号持有者邮箱
# 发送时间由用户在个人设置页自定义（每日/每周 + 周几 + 小时），定时器每小时整点检查
report:
  push:
    enabled: true                                           # 总开关（false 时定时任务直接跳过）
    resend-api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:FinanceAgent <onboarding@resend.dev>}

# 日志（开发环境全开，方便调试）
logging:
  level:
    com.finance: debug
    org.springframework.security: info
    root: info

# 关闭旧版MyBatis
mybatis:
  mapper-scan:
    enabled: false