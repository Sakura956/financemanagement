# 生产环境配置 - 企业标准
server:
  port: 8080
  servlet:
    session:
      tracking-modes: cookie  # 生产环境安全配置

spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/finance_management?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 900000
      connection-timeout: 10000
      connection-test-query: SELECT 1

  # Redis 配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
      resolve-lazily: true

  # Spring AI 配置（Agent 化改造，双供应商均走 OpenAI 兼容协议）
  #   Chat → DeepSeek 官方（Tool Calling）；Embedding → SiliconFlow（bge-m3）
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        api-key: ${AI_API_KEY}
        base-url: https://api.deepseek.com
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2000
      embedding:
        api-key: ${SILICONFLOW_API_KEY}
        base-url: https://api.siliconflow.cn
        options:
          model: BAAI/bge-m3

# MyBatis-Plus 生产环境配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.finance.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000

# AI 配置（旧版 RestTemplate 直连实现，保留给 UniApp 端使用）
ai:
  enabled: true
  provider: deepseek
  model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
  api-key: ${SILICONFLOW_API_KEY}
  base-url: https://api.siliconflow.cn/v1
  timeout: 60000
  max-tokens: 1000

# Agent 模块配置（Agent 化改造）
agent:
  rag:
    enabled: true
    index-on-startup: true
    top-k: 5
    similarity-threshold: 0.2
  memory:
    max-messages: 20
    redis-prefix: "agent:memory:"
    ttl-days: 7

# 周报邮件推送（Resend HTTP API）
# 发送时间由用户在个人设置页自定义，定时器每小时整点检查
report:
  push:
    enabled: true
    resend-api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:FinanceAgent <onboarding@resend.dev>}

# 日志（企业标准）
logging:
  level:
    com.finance: info
    org.springframework.security: warn
    org.springframework.web: warn
    org.springframework.web.servlet.resource: warn
    root: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 关闭旧版 MyBatis
mybatis:
  mapper-scan:
    enabled: false

# 生产环境优化
spring.main.banner-mode: "off"
spring.lifecycle.timeout-per-shutdown-phase: 30s